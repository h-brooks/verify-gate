[package]
name = "verify-gate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Claude Code Stop hook that blocks done-claims when files were edited but nothing was verified afterwards"
repository = "https://github.com/h-brooks/verify-gate"
keywords = ["claude-code", "hooks", "agents", "verification", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "verify-gate"
path = "src/main.rs"

[lib]
name = "verify_gate"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
