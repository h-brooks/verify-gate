[package]
name = "verify-gate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "verify-gate"
path = "src/main.rs"

[lib]
name = "verify_gate"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
